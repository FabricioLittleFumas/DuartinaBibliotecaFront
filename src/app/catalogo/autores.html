<section class="catalog-page"><header class="catalog-heading"><div><span class="eyebrow">Acervo</span><h1>Autores</h1><p>Conheça as pessoas por trás das histórias.</p></div><span class="count-pill">{{autores.length}} encontrados</span></header><div class="catalog-layout" [class.somente-leitura]="!podeGerenciar"><form *ngIf="podeGerenciar" class="editor-card" (ngSubmit)="salvar()"><h2>{{editando===null?'Novo autor':'Editar autor'}}</h2><label>Nome<input name="nome" [(ngModel)]="form.nome" required maxlength="150" placeholder="Nome completo"></label><label>Nacionalidade<input name="nacionalidade" [(ngModel)]="form.nacionalidade" maxlength="100" placeholder="Ex.: Brasileira"></label><label>Biografia<textarea name="biografia" [(ngModel)]="form.biografia" maxlength="4000" rows="5" placeholder="Uma breve apresentação"></textarea></label><p class="error" *ngIf="erro">{{erro}}</p><div class="form-actions"><button class="primary" [disabled]="salvando">{{salvando?'Salvando…':editando===null?'Cadastrar autor':'Salvar alterações'}}</button><button *ngIf="editando!==null" class="secondary" type="button" (click)="cancelar()">Cancelar</button></div></form><div class="list-panel"><form class="search-row" (ngSubmit)="buscar()"><input name="busca" [(ngModel)]="nomeBusca" placeholder="Buscar autor pelo nome"><button class="secondary">Buscar</button></form><p class="error" *ngIf="erro && !autores.length">{{erro}}</p><div class="author-list"><article class="author-card" *ngFor="let autor of autores"><span class="author-avatar"><i class="pi pi-user"></i></span><div class="author-copy"><h3>{{autor.nome}}</h3><small>{{autor.nacionalidade||'Nacionalidade não informada'}}</small><p *ngIf="autor.biografia">{{autor.biografia}}</p></div><div class="card-actions" *ngIf="podeGerenciar"><button type="button" (click)="editar(autor)" aria-label="Editar autor"><i class="pi pi-pencil"></i></button><button type="button" (click)="excluir(autor)" aria-label="Excluir autor"><i class="pi pi-trash"></i></button></div></article><div class="empty" *ngIf="!autores.length && !erro"><i class="pi pi-users"></i><span>Nenhum autor encontrado.</span></div></div></div></div></section>
